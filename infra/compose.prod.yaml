# Production override - use with: docker compose -f compose.yaml -f compose.prod.yaml up -d
# Contains: stricter security, resource limits, no bind mounts, image pinning

services:
  # Hardened backend
  backend:
    read_only: true
    tmpfs:
      - /var/www/html/storage
      - /var/www/html/bootstrap/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "1.0"
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Hardened Reverb
  reverb:
    read_only: true
    tmpfs:
      - /var/www/html/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first

  # Hardened queue workers
  queue-worker:
    read_only: true
    tmpfs:
      - /var/www/html/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    deploy:
      replicas: 4
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # Hardened scheduler
  scheduler:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

  # Hardened frontend (nginx)
  frontend:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1001:1001"

  # Hardened nginx
  nginx:
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: "101:101"  # nginx user
    deploy:
      replicas: 2

  # Hardened MongoDB
  mongodb:
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mongodb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "999:999"  # mongodb user

  # Hardened Redis
  redis:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "999:999"  # redis user

# Production networks - stricter
networks:
  frontend-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.28.1.0/24

  backend-internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.28.2.0/24

# Logging to external systems (Loki, ELK, etc.)
# Override per-service logging in compose.yaml as needed