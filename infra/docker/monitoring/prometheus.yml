global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'auction-marketplace'
    environment: '${APP_ENV:-production}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:9000']
    metrics_path: '/metrics'

  - job_name: 'reverb'
    static_configs:
      - targets: ['reverb:8080']
    metrics_path: '/metrics'

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']