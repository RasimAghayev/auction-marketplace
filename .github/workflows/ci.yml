name: CI

# Docker-first pipeline (CLAUDE.md standing decision 2): every check that needs the
# backend/frontend stack runs through this repo's own infra/compose.yaml test
# profiles instead of invoking php/composer/node/npm directly on the runner.
# This also fixes two defects found 2026-11-25:
#   - the previous workflow ran composer/pest and npm/vite straight on ubuntu-latest,
#     never exercising this repo's own Dockerfiles at all;
#   - the previous backend-tests job had `continue-on-error: true`, so a red test
#     suite still reported CI as green.

on:
  push:
    branches: [master, main, preview, test]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main, preview, test]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: infra/compose.yaml

jobs:
  prepare-secrets:
    name: Generate ephemeral CI secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cache-key: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate throwaway local secret files (never committed, CI-only)
        run: |
          mkdir -p secrets
          openssl rand -base64 32 > secrets/mongodb_root_password.txt
          echo "ci-admin" > secrets/mongodb_root_username.txt
          openssl rand -base64 32 > secrets/redis_password.txt
          openssl rand -base64 32 > secrets/mongo_express_password.txt
          echo "ci-admin" > secrets/mongo_express_user.txt
          openssl rand -base64 32 > secrets/redis_commander_password.txt
          echo "ci-admin" > secrets/redis_commander_user.txt
          openssl rand -base64 32 > secrets/grafana_admin_password.txt
          echo "ci-admin" > secrets/grafana_admin_user.txt
      - name: Upload secrets as a run-scoped artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-secrets-${{ github.run_id }}
          path: secrets/
          retention-days: 1

  backend-tests:
    name: Backend tests (Docker test-backend profile)
    needs: prepare-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ci-secrets-${{ github.run_id }}
          path: secrets/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Start core infra (mongodb, redis)
        run: docker compose -f "$COMPOSE_FILE" --profile core up -d mongodb redis
      - name: Wait for infra health
        run: |
          for i in $(seq 1 30); do
            status=$(docker compose -f "$COMPOSE_FILE" ps --format json mongodb redis | grep -c '"Health":"healthy"' || true)
            if [ "$status" -ge 2 ]; then echo "infra healthy"; exit 0; fi
            sleep 2
          done
          echo "infra did not become healthy in time" >&2
          docker compose -f "$COMPOSE_FILE" ps
          exit 1
      - name: Run backend test suite in Docker (test-backend profile)
        run: |
          docker compose -f "$COMPOSE_FILE" --profile backend-test run --rm test-backend
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" --profile core --profile backend-test down -v

  frontend-tests:
    name: Frontend unit tests (Docker test-frontend profile)
    needs: prepare-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ci-secrets-${{ github.run_id }}
          path: secrets/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend base image (needed by test-frontend)
        run: docker compose -f "$COMPOSE_FILE" --profile core build frontend
      - name: Run frontend unit tests in Docker (test-frontend profile)
        run: docker compose -f "$COMPOSE_FILE" --profile frontend-test run --rm test-frontend
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" --profile core --profile frontend-test down -v

  image-build:
    name: Production image build validation
    needs: prepare-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ci-secrets-${{ github.run_id }}
          path: secrets/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend + frontend production images (no run, build-only)
        run: docker compose -f "$COMPOSE_FILE" --profile core build backend frontend
