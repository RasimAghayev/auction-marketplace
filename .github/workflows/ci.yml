name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
      redis:
        image: redis:8
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, redis
      - name: Prepare cache dir
        working-directory: backend
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Run tests
        working-directory: backend
        run: vendor/bin/pest
        env:
          APP_ENV: testing
          DB_CONNECTION: mongodb_testing
          MONGODB_URI_TESTING: mongodb://localhost:27017
          MONGODB_USERNAME_TESTING: ""
          MONGODB_PASSWORD_TESTING: ""

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npx vite build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Composer audit
        working-directory: backend
        run: composer audit --locked


